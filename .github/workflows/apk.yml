name: apk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: neguezi-apk
          path: android/app/build/outputs/apk/release/*.apk
  labo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm install --legacy-peer-deps @livekit/react-native @livekit/react-native-webrtc @livekit/react-native-expo-plugin @config-plugins/react-native-webrtc livekit-client react-native-audio-api
      - run: node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.plugins=(j.expo.plugins||[]).concat(['@livekit/react-native-expo-plugin','@config-plugins/react-native-webrtc','react-native-audio-api']);fs.writeFileSync('app.json',JSON.stringify(j,null,2))"
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: neguezi-apk-labo
          path: android/app/build/outputs/apk/release/*.apk
